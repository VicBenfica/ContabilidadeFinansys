<main class="login-page">
    <section class="login-panel" aria-labelledby="recuperar-titulo">
        <img class="logo" src="logoFinanSysHorizontal.png" alt="FinanSys — Sistema Contábil">

        <h1 id="recuperar-titulo">Recuperar senha</h1>
        <p class="descricao">Informe o e-mail cadastrado para iniciar a recuperação.</p>

        <form #form="ngForm" (ngSubmit)="enviar(form)">
            <div class="campo">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" placeholder="nome@exemplo.com" autocomplete="email"
                    [(ngModel)]="email" #emailInput="ngModel"
                    [attr.aria-invalid]="emailInput.touched && emailInput.invalid"
                    [attr.aria-describedby]="emailInput.touched && emailInput.invalid ? 'email-erro' : null" required
                    email>
                @if (emailInput.touched && emailInput.invalid) {
                <small class="erro" id="email-erro">Informe um e-mail válido.</small>
                }
            </div>

            <button type="submit" class="acao entrar">Enviar link de recuperação</button>
            <a class="acao cadastro" routerLink="/login">Voltar ao login</a>

            @if (mensagem) {
            <p class="mensagem" role="status">{{ mensagem }}</p>
            }
        </form>
    </section>
</main>
