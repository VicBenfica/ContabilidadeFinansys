<header class="tb-barra">
  <span class="tb-titulo">Escrituração contábil</span>

  <div class="tb-acoes">
    <div class="tb-empresa">
      <span class="tb-label">Empresa</span>

      <details
        #menuEmpresas
        class="tb-seletor"
        (keydown.escape)="menuEmpresas.open = false; botaoEmpresas.focus()"
      >
        <summary
          #botaoEmpresas
          class="tb-botao tb-gatilho"
          [attr.aria-label]="'Empresa selecionada: ' + empresa()"
        >
          <span>{{ empresa() }}</span>
        </summary>

        <ul class="tb-lista" aria-label="Empresas cadastradas">
          @for (item of empresas.lista(); track item.id) {
            @let atual = empresas.selecionada()?.id === item.id;

            <li>
              <button
                type="button"
                class="tb-opcao"
                [class.tb-opcao-atual]="atual"
                [attr.aria-current]="atual ? 'true' : null"
                (click)="selecionarEmpresa(item.id); menuEmpresas.open = false; botaoEmpresas.focus()"
              >
                {{ item.nomeFantasia }}
                @if (atual) {
                  <span aria-hidden="true">✓</span>
                }
              </button>
            </li>
          } @empty {
            <li class="tb-vazio">Nenhuma empresa cadastrada.</li>
          }
        </ul>
      </details>
    </div>

    <a class="tb-botao" routerLink="/empresas">
      + Adicionar empresa
    </a>

    <a
      class="tb-botao tb-primario"
      routerLink="/livro-diario"
      [queryParams]="{ novo: '1' }"
    >
      + Novo lançamento
    </a>
  </div>
</header>
